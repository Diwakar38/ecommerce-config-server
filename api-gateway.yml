spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: ${ORDER_SERVICE_URI:lb://ORDER-SERVICE}
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - StripPrefix=2
                - name: LoggingOrdersFilter
#                - name: Authentication
#                  args:
#                    isEnabled: true
            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URI:lb://INVENTORY-SERVICE}
              predicates:
                - Path=/api/v1/inventory/**
              filters:
                - StripPrefix=2
#                - name: Authentication
#                  args:
#                    isEnabled: true

