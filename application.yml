management:
 endpoints:
  web:
   exposure:
    include: "*"
 tracing:
  sampling:
   probability: 1.0

eureka:
  instance:
    instance-id: ${spring.application.name}:${server.port}
    hostname: localhost
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    refresh:
     enable: false

spring.zipkin.baseUrl: http://localhost:9411
